background {
    monitor =
    path = $HOME/arch_dotfiles/hyprland/.config/hypr/.current_wallpaper
	blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 1
    vibrancy = 0.696
    vibrancy_darkness = 0.5
    }

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.4
    dots_spacing = 0.2 
    dots_center = true
    outer_color = rgba(40, 40, 40, 0.7)
    inner_color = rgba(30, 32, 48, 0.5)
    font_color = rgb(194, 194, 183)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    halign = center
    valign = center
    position = 0, -25%

}
label {
	monitor =
	text = $TIME
	font_size = 90
	font_family = Iosevka Nerd Font
    	color = rgb(202, 211, 205)
	position = 0, 50
    	halign = center
    	valign = center
}

label {
	monitor =
	text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
	font_size = 40
	font_family = Iosevka Nerd Font
    	color = rgb(202, 211, 205)
	position = 0, -50
    	halign = center
    	valign = center
}
